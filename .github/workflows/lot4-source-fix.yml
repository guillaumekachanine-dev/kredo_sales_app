name: Lot 4 source cleanup

on:
  push:
    branches:
      - feat/assistance-case-opportunity-perspective-lot4

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/assistance-case-opportunity-perspective-lot4
          fetch-depth: 0

      - name: Remove historical local drawer mounts
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/recruitment/RecruitmentWorkspace.tsx')
          text = path.read_text()
          text = text.replace('import { StaffingDrawer } from "@/components/staffing/StaffingDrawer"\n', '')
          lines = [line for line in text.splitlines() if line.strip() != '<StaffingDrawer />']
          path.write_text('\n'.join(lines) + '\n')

          temporary_core = Path('src/components/staffing/StaffingDrawerCore.tsx')
          if temporary_core.exists():
              temporary_core.unlink()
          PY

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/recruitment/RecruitmentWorkspace.tsx src/components/staffing/StaffingDrawerCore.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(recruitment): keep assistance drawer mounted globally"
          git push origin HEAD:feat/assistance-case-opportunity-perspective-lot4
