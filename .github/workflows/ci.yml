name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      # Assertion statique (quelques millisecondes) : tout module important
      # @/lib/supabase/server doit porter la garde `import "server-only"`.
      # Placée avant les tests et le build parce qu'elle est instantanée et que
      # son message nomme directement le fichier fautif — alors que le build
      # Turbopack, lui, tolère silencieusement cette classe de violation.
      - name: Server/client boundary
        run: npm run check:server-boundary

      - name: Run tests
        run: npm test

      - name: Build application
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://jvzgmhvwirsbdkjpmvla.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
        run: npm run build
